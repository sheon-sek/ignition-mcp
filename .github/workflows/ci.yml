name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Everything that is not a pytest run: the lockfile, the linters, mypy, and the
  # deterministic build/validate lanes. The unit suite is split into the two jobs
  # below so each half gets a runner of its own; only `jython-handlers` installs
  # Java, because only its paths start the recorded-Jython runner (D29).
  static-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Verify lockfile
        run: uv lock --check
      - name: Ruff
        run: uvx --from ruff==0.16.8 ruff check .
      - name: Lint workflows and shell run blocks
        run: uv run --no-sync python -m tooling.ci.check_workflows
      - name: Mypy
        run: uv run --locked --package ignition-rest-mcp --with mypy==2.3.1 mypy packages/ignition-rest-mcp/src tooling
      - name: Build external Python distribution
        run: uv build --package ignition-rest-mcp
      - name: Validate Runtime Designer project
        run: uv run --no-sync python -m tooling.native.cli validate --project-dir packages/ignition-runtime-bundle/project
      - name: Build production Runtime Bundle twice
        run: |
          uv run --no-sync python -m tooling.native.cli build \
            --project-dir packages/ignition-runtime-bundle/project \
            --output dist/runtime-first.zip
          uv run --no-sync python -m tooling.native.cli build \
            --project-dir packages/ignition-runtime-bundle/project \
            --output dist/runtime-second.zip
          cmp dist/runtime-first.zip dist/runtime-second.zip
      - name: Validate compatibility evidence
        run: uv run --no-sync python -m tooling.compat validate --evidence-dir tests/compatibility/evidence
      - name: Build deterministic Runtime Bundle release twice
        run: |
          uv run --no-sync python -m tooling.native.cli release \
            --project-dir packages/ignition-runtime-bundle/project \
            --out-dir dist/release-a \
            --source-revision "$(git rev-parse HEAD)" \
            --evidence-dir tests/compatibility/evidence
          uv run --no-sync python -m tooling.native.cli release \
            --project-dir packages/ignition-runtime-bundle/project \
            --out-dir dist/release-b \
            --source-revision "$(git rev-parse HEAD)" \
            --evidence-dir tests/compatibility/evidence
          for f in dist/release-a/*; do cmp "$f" "dist/release-b/$(basename "$f")"; done
      - name: Unpack the release ZIP and re-run structural validation
        run: |
          mkdir -p dist/release-unpacked
          unzip -q dist/release-a/ignition-runtime-bundle-*.zip -d dist/release-unpacked
          cp packages/ignition-runtime-bundle/BUNDLE_VERSION packages/ignition-runtime-bundle/RESOURCE_SCHEMA_VERSION dist/
          uv run --no-sync python -m tooling.native.cli validate --project-dir dist/release-unpacked
      - name: Validate Phase 0 live characterization fixture
        run: |
          (cd tests/fixtures/modules && sha256sum -c MCP-module-1.3.5.2026021307-SNAPSHOT.sha256)
          uv run --no-sync python -m tooling.native.cli validate --project-dir tests/harness/runtime-binding/project
          uv run --no-sync python tests/harness/runtime-binding/build_fixture.py dist/g0-first.zip
          uv run --no-sync python tests/harness/runtime-binding/build_fixture.py dist/g0-second.zip
          cmp dist/g0-first.zip dist/g0-second.zip
          uv run --no-sync python -m py_compile \
            tests/harness/runtime-binding/probe.py \
            tests/harness/runtime-binding/build_fixture.py \
            tests/harness/runtime-binding/prepare_ci_security.py

  # The recorded-Jython handler tests: one interpreter start per fixture, so they
  # are the CPU-bound half and get their own runner. The paths below are the only
  # ones that start Java; `python-tests` runs everything else.
  jython-handlers:
    runs-on: ubuntu-latest
    # One JVM per recorded call, and a hung interpreter has to fail the job rather
    # than hold a runner for the default six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install Java 11 for the recorded Jython runner (D29)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "11"
      - name: Recorded Jython handler tests
        # -n 2 is the runner's two cores; --dist loadfile keeps one test file per
        # worker, and --durations names the slowest cases of this half.
        run: uv run --locked --package ignition-rest-mcp --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n 2 --dist loadfile --durations=15 tooling/native/jython_runner/tests

  # Everything else the unit suite covers: the harnesses, the contracts tooling and
  # the external server's tests. No Java is installed here — nothing under these
  # paths starts the recorded-Jython runner.
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Unit and contract tests
        run: uv run --locked --package ignition-rest-mcp --with pytest==9.1.1 --with pytest-xdist==3.8.0 pytest -q -n 2 --dist loadfile --durations=15 tooling packages/ignition-rest-mcp/tests --ignore=tooling/native/jython_runner/tests

  # The one status check that means the whole workflow is green. Its `needs` is the
  # list of every other job, so requiring this job cannot merge a partial run.
  ci-gate:
    name: CI gate
    needs: [static-unit-build, jython-handlers, python-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        run: |
          echo "static-unit-build: ${{ needs['static-unit-build'].result }}"
          echo "jython-handlers: ${{ needs['jython-handlers'].result }}"
          echo "python-tests: ${{ needs['python-tests'].result }}"
          test "${{ needs['static-unit-build'].result }}" = success
          test "${{ needs['jython-handlers'].result }}" = success
          test "${{ needs['python-tests'].result }}" = success
