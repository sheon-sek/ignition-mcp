name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install Java 11 for the recorded Jython runner (D29)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "11"
      - name: Verify lockfile
        run: uv lock --check
      - name: Ruff
        run: uvx --from ruff==0.16.8 ruff check .
      - name: Lint workflows and shell run blocks
        run: uv run --no-sync python -m tooling.ci.check_workflows
      - name: Mypy
        run: uv run --locked --package ignition-rest-mcp --with mypy==2.3.1 mypy packages/ignition-rest-mcp/src tooling
      - name: Unit and contract tests
        run: uv run --locked --package ignition-rest-mcp --with pytest==9.1.1 pytest -q tooling packages/ignition-rest-mcp/tests
      - name: Build external Python distribution
        run: uv build --package ignition-rest-mcp
      - name: Validate Runtime Designer project
        run: uv run --no-sync python -m tooling.native.cli validate --project-dir packages/ignition-runtime-bundle/project
      - name: Build production Runtime Bundle twice
        run: |
          uv run --no-sync python -m tooling.native.cli build \
            --project-dir packages/ignition-runtime-bundle/project \
            --output dist/runtime-first.zip
          uv run --no-sync python -m tooling.native.cli build \
            --project-dir packages/ignition-runtime-bundle/project \
            --output dist/runtime-second.zip
          cmp dist/runtime-first.zip dist/runtime-second.zip
      - name: Validate compatibility evidence
        run: uv run --no-sync python -m tooling.compat validate --evidence-dir tests/compatibility/evidence
      - name: Build deterministic Runtime Bundle release twice
        run: |
          uv run --no-sync python -m tooling.native.cli release \
            --project-dir packages/ignition-runtime-bundle/project \
            --out-dir dist/release-a \
            --source-revision "$(git rev-parse HEAD)" \
            --evidence-dir tests/compatibility/evidence
          uv run --no-sync python -m tooling.native.cli release \
            --project-dir packages/ignition-runtime-bundle/project \
            --out-dir dist/release-b \
            --source-revision "$(git rev-parse HEAD)" \
            --evidence-dir tests/compatibility/evidence
          for f in dist/release-a/*; do cmp "$f" "dist/release-b/$(basename "$f")"; done
      - name: Unpack the release ZIP and re-run structural validation
        run: |
          mkdir -p dist/release-unpacked
          unzip -q dist/release-a/ignition-runtime-bundle-*.zip -d dist/release-unpacked
          cp packages/ignition-runtime-bundle/BUNDLE_VERSION packages/ignition-runtime-bundle/RESOURCE_SCHEMA_VERSION dist/
          uv run --no-sync python -m tooling.native.cli validate --project-dir dist/release-unpacked
      - name: Validate Phase 0 live characterization fixture
        run: |
          (cd tests/fixtures/modules && sha256sum -c MCP-module-1.3.5.2026021307-SNAPSHOT.sha256)
          uv run --no-sync python -m tooling.native.cli validate --project-dir tests/harness/runtime-binding/project
          uv run --no-sync python tests/harness/runtime-binding/build_fixture.py dist/g0-first.zip
          uv run --no-sync python tests/harness/runtime-binding/build_fixture.py dist/g0-second.zip
          cmp dist/g0-first.zip dist/g0-second.zip
          uv run --no-sync python -m py_compile \
            tests/harness/runtime-binding/probe.py \
            tests/harness/runtime-binding/build_fixture.py \
            tests/harness/runtime-binding/prepare_ci_security.py
