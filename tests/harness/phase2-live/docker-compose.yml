services:
  postgres:
    image: postgres:16.4-alpine3.20
    environment:
      POSTGRES_DB: ignition_mcp_ci
      POSTGRES_USER: ignition_mcp_ci
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignition_mcp_ci -d ignition_mcp_ci"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - phase2-postgres-data:/var/lib/postgresql/data

  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be an exact patch tag}
    pull_policy: never
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: "admin"
      GATEWAY_ADMIN_PASSWORD: "phase2-ci-only-not-a-production-secret"
      IGNITION_EDITION: "standard"
      DISABLE_QUICKSTART: "true"
      GATEWAY_MODULES_ENABLED: "com.inductiveautomation.mcp"
      ACCEPT_MODULE_CERTS: "com.inductiveautomation.mcp"
      IGNITION_MCP_DATABASE_QUERY_REGISTRY_JSON: >-
        {"schemaVersion":1,"entries":[{"alias":"ci_page","description":"Bounded PostgreSQL CI fixture query.","project":"ignition_mcp_phase2_fixtures","path":"mcp_ci/page","resultMode":"dataset","datasourcePolicy":"named-query-fixed","parameters":{},"pagination":{"mode":"offset","limitParameter":"limit","offsetParameter":"offset","defaultPageSize":2,"hardPageSize":100,"maxOffset":1000}}]}
    volumes:
      - phase2-gateway-data:/usr/local/bin/ignition/data
      - ../../fixtures/modules/MCP-module-1.3.5.2026021307-SNAPSHOT.modl:/usr/local/bin/ignition/user-lib/modules/MCP-module.modl:ro
    command: >
      -n ignition-mcp-phase2-ci
      -m 1536

volumes:
  phase2-gateway-data:
  phase2-postgres-data:
