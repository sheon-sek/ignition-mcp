services:
  gateway:
    image: ${GATEWAY_IMAGE:?GATEWAY_IMAGE must be an exact patch tag}
    pull_policy: never
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: "admin"
      GATEWAY_ADMIN_PASSWORD: "phase3-ci-only-not-a-production-secret"
      IGNITION_EDITION: "standard"
      DISABLE_QUICKSTART: "true"
      GATEWAY_MODULES_ENABLED: "com.inductiveautomation.mcp,com.inductiveautomation.historian,com.inductiveautomation.alarm-notification"
      ACCEPT_MODULE_CERTS: "com.inductiveautomation.mcp"
    volumes:
      - phase3-gateway-data:/usr/local/bin/ignition/data
      - ../../fixtures/modules/MCP-module-1.3.5.2026021307-SNAPSHOT.modl:/usr/local/bin/ignition/user-lib/modules/MCP-module.modl:ro
    command: >
      -n ignition-mcp-phase3-ci
      -m 1536

volumes:
  phase3-gateway-data:
