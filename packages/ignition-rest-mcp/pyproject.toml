[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[project]
name = "ignition-rest-mcp"
version = "0.1.0a0"
description = "External FastMCP server for curated Ignition Native REST capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Ignition MCP contributors" }]
dependencies = [
  "fastmcp==4.0.5",
  "httpx==0.28.1",
  # D03 requires generic config writes to be validated against the target Gateway's
  # own OpenAPI request schema. jsonschema is already in the lock (fastmcp's OpenAPI
  # server extra pulls jsonschema-path), and it is declared here because the server
  # itself now depends on it.
  "jsonschema==4.26.0",
  "pydantic>=2.11,<3",
  "questionary==2.1.1",
  "rich==15.0.0",
]

[project.scripts]
ignition-mcp = "ignition_rest_mcp.cli.engine.main:main"
ignition-rest-mcp = "ignition_rest_mcp.server:main"
