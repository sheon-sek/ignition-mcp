[build-system]
requires = ["uv_build==0.12.17"]
build-backend = "uv_build"

[project]
name = "ignition-rest-mcp"
version = "0.1.0a0"
description = "External FastMCP server for curated Ignition Native REST capabilities"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Ignition MCP contributors" }]
dependencies = [
  "fastmcp==4.0.5",
  "httpx==0.28.1",
  "pydantic>=2.11,<3",
]

[project.scripts]
ignition-mcp = "ignition_rest_mcp.cli.setup_native.main:main"
ignition-rest-mcp = "ignition_rest_mcp.server:main"
